<html lang="en">

		<!-- Trick or Treat .io web shell (web/shell.html, the Web presets' custom_html_shell).
		     Night paper and porch orange like the game's menus (docs/ART_STYLE.md "UI look"),
		     so loading and the first frame read as one thing, in the arcade iframe or alone.
		     tools/web_build.sh adds the phone/desktop pack choice before the engine starts. -->
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	background: #160c1f;
	color: #f1e2c4;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background: radial-gradient(ellipse at 50% 120%, #ef8a2b 0%, #6a2f2a 28%, #2a1d38 62%, #160c1f 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	gap: 0.9rem;
	visibility: hidden;
	text-align: center;
	padding: 1.5rem;
	box-sizing: border-box;
	font-family: 'Nunito', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
}
#status-eyebrow {
	font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
	color: #ef8a2b;
}
#status-title {
	font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive;
	font-weight: 400;
	color: #ef8a2b;
	transform: rotate(-2deg);
	font-size: clamp(2.8rem, 13vw, 4.6rem);
	line-height: 1;
	text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
}
#status-tag { color: #c9b8d6; font-size: clamp(0.9rem, 3.6vw, 1.05rem); }
#status-bar {
	width: min(64vw, 300px); height: 10px; margin-top: 0.6rem;
	border-radius: 999px; background: rgba(0, 0, 0, 0.4); overflow: hidden;
	display: none;
}
#status-fill {
	height: 100%; width: 0%;
	background: linear-gradient(90deg, #ef8a2b, #ffd35c);
	border-radius: 999px;
	transition: width 0.2s ease-out;
}
#status-fill.indeterminate { width: 35%; animation: slide 1.2s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0%; } to { margin-left: 65%; } }
#status-notice {
	display: none;
	background: #f1e2c4; color: #1c1023;
	border-radius: 18px; line-height: 1.45;
	max-width: 30rem; padding: 1rem 1.25rem;
	box-shadow: 0 6px 14px rgba(0, 0, 0, 0.38);
}
#status-splash { display: none; }
		</style>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Trick or Treat .io needs JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-eyebrow">A Halloween .io game</div>
			<div id="status-title">Trick or Treat .io</div>
			<div id="status-tag">Filling the pillowcases&hellip;</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<script>
// Audio unlock. Browsers keep audio suspended until a user gesture, and iOS
// Safari only lets it start *inside* one. The engine creates its AudioContext
// (GodotAudio.ctx) out of reach, so the constructor is wrapped here, before the
// engine loads, and every instance is recorded. Each tap / click / key then,
// synchronously in the handler:
//   * on iOS, sets navigator.audioSession to "playback" (iOS 17+) and plays a
//     silent looping <audio>, so the ring/silent switch does not mute the game;
//   * resumes every context that is not running.
// window.totAudioUnlocked turns true once a gesture has run them all;
// core/audio.gd polls it and restarts the requested music then, so the title's
// first input ("Tap to start" / any key) is the moment the menu music starts.
// The listeners stay: iOS suspends ("interrupted") on calls and app switches.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	const ua = navigator.userAgent;
	const IOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
	let gestured = false;
	let tag = null;
	window.totAudioUnlocked = false;
	window.totAudioContexts = ctxs;  // read by the page checks
	function update() {
		const live = ctxs.filter((c) => c.state !== 'closed');
		if (gestured && live.length > 0 && live.every((c) => c.state === 'running')) {
			window.totAudioUnlocked = true;
		}
	}
	if (AC) {
		const Wrapped = function (...args) {
			const c = new AC(...args);
			ctxs.push(c);
			c.addEventListener('statechange', update);
			return c;
		};
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// 0.5 s of 8-bit silence (a WAV built here: no extra file to fetch)
	function silentWav() {
		const rate = 8000, n = 4000, v = new DataView(new ArrayBuffer(44 + n));
		const str = (o, t) => { for (let i = 0; i < t.length; i++) { v.setUint8(o + i, t.charCodeAt(i)); } };
		str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
		v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
		v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		str(36, 'data'); v.setUint32(40, n, true);
		for (let i = 0; i < n; i++) { v.setUint8(44 + i, 128); }
		return URL.createObjectURL(new Blob([v.buffer], { type: 'audio/wav' }));
	}
	function playbackSession() {
		if (!IOS || document.hidden) { return; }
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* older iOS */ }
		if (!tag) {
			tag = document.createElement('audio');
			tag.setAttribute('playsinline', '');
			tag.setAttribute('x-webkit-airplay', 'deny');
			tag.disableRemotePlayback = true;
			tag.loop = true;
			tag.preload = 'auto';
			tag.src = silentWav();
		}
		if (tag.paused) { const p = tag.play(); if (p) { p.catch(() => {}); } }
	}
	function unlock(ev) {
		if (ev && ev.isTrusted === false) { return; }
		playbackSession();
		if (ctxs.length > 0) { gestured = true; }
		ctxs.forEach((c) => {
			if (c.state !== 'running' && c.state !== 'closed') {
				const p = c.resume();
				if (p) { p.then(update, () => {}); }
			}
		});
		update();
	}
	['pointerdown', 'pointerup', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'].forEach((e) =>
		window.addEventListener(e, unlock, { capture: true, passive: true }));
	// the silent loop would show in the lock screen's player: pause it while hidden
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			if (tag && !tag.paused) { tag.pause(); }
		} else if (gestured) {
			playbackSession();
			ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(() => {}); } });
		}
	});
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8680208,"index.wasm":37686550,"index.mobile.pck":5449360},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const TOT_PACK = (function () {
	const forced = new URLSearchParams(location.search).get('pack');
	if (forced === 'mobile' || forced === 'desktop') return forced === 'mobile' ? 'index.mobile.pck' : 'index.pck';
	const ua = navigator.userAgent;
	const phone = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
		|| window.matchMedia('(max-width: 768px), (pointer: coarse)').matches;
	return phone ? 'index.mobile.pck' : 'index.pck';  // phones never download the desktop package
}());
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	let initializing = true;
	let mode = '';

	function setMode(m) {
		if (mode === m || !initializing) { return; }
		if (m === 'hidden') { overlay.remove(); initializing = false; return; }
		overlay.style.visibility = 'visible';
		bar.style.display = m === 'progress' ? 'block' : 'none';
		notice.style.display = m === 'notice' ? 'block' : 'none';
		mode = m;
	}

	function fail(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong loading the neighbourhood.');
		notice.textContent = '';
		text.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
		setMode('notice');
		initializing = false;
	}

	// Keep keyboard focus on the game after taps on the page.
	document.addEventListener('pointerdown', () => {
		const c = document.getElementById('canvas');
		if (c && document.activeElement !== c) { c.focus(); }
	}, true);
	// The page itself never zooms (pinch, double-tap).
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs:\n' + missing.join('\n') + '\nTry a current Chrome, Edge, Firefox or Safari.');
		return;
	}
	setMode('progress');
	engine.startGame({
			'mainPack': TOT_PACK,
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.classList.remove('indeterminate');
				fill.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
			} else {
				fill.classList.add('indeterminate');
			}
		},
	}).then(() => setMode('hidden'), fail);
}());
		</script>
	</body>
